<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KeyBridge</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KeyBridge">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{ --bg:#14161a; --card:#1e2127; --line:#30343d; --txt:#e8eaed; --mut:#9aa0aa;
         --accent:#4c8dff; --ok:#39c07a; --warn:#e4574c; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif;
       padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:18px;margin:4px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:14px}
  button{font:inherit;font-weight:600;border:0;border-radius:11px;padding:13px 16px;
         width:100%;color:#fff;background:var(--accent)}
  button:active{filter:brightness(.9)} button.ghost{background:#2a2e36}
  button.scan{background:#2a2e36} button:disabled{opacity:.45}
  textarea{width:100%;min-height:92px;background:#0f1115;color:var(--txt);
           border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;resize:vertical}
  .row{display:flex;gap:10px;margin-top:10px} .row>*{flex:1}
  label.chk{display:flex;align-items:center;gap:9px;color:var(--mut);margin-top:10px;font-size:15px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:4px}
  .seg button{border-radius:0;background:transparent;color:var(--mut);font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}
  .status{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:14px;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}
  .dot.on{background:var(--ok)}
  #cam{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
  #cam video{flex:1;width:100%;object-fit:cover}
  #cam .bar{padding:14px}
  small{color:var(--mut)}
</style>
</head>
<body>
  <h1>KeyBridge → ESP32-Keys</h1>

  <div class="card">
    <button id="btnConn">Mit ESP verbinden</button>
    <div class="status"><span class="dot" id="dot"></span><span id="st">nicht verbunden</span></div>
  </div>

  <div class="card">
    <small>Layout am Ziel-Notebook</small>
    <div class="seg">
      <button id="segEN" class="on" data-m="EN">US (EN)</button>
      <button id="segDE" data-m="DE">DE / QWERTZ</button>
    </div>
  </div>

  <div class="card">
    <textarea id="txt" placeholder="Text einfügen oder QR scannen…"></textarea>
    <label class="chk"><input type="checkbox" id="enter" checked> Enter danach drücken</label>
    <label class="chk"><input type="checkbox" id="autosend"> Nach QR-Scan direkt senden</label>
    <div class="row">
      <button class="scan" id="btnScan">QR scannen</button>
      <button id="btnSend" disabled>Senden</button>
    </div>
  </div>

  <div id="cam">
    <video id="video" playsinline></video>
    <div class="bar"><button class="ghost" id="btnStop">Scan abbrechen</button></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX ='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
let rxChar=null, dev=null;

const $=id=>document.getElementById(id);
const setStatus=(t,ok)=>{ $('st').textContent=t; $('dot').classList.toggle('on',!!ok);
  $('btnSend').disabled=!ok; };

async function connect(){
  try{
    setStatus('suche…',false);
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',()=>setStatus('getrennt',false));
    const s=await (await dev.gatt.connect()).getPrimaryService(SVC);
    rxChar=await s.getCharacteristic(RX);
    setStatus('verbunden: '+(dev.name||'ESP'),true);
    sendLayout();              // aktuelles Layout an ESP schicken
  }catch(e){ setStatus('Fehler: '+e.message,false); }
}

async function writeChunked(str){
  if(!rxChar) return;
  const data=new TextEncoder().encode(str);
  for(let i=0;i<data.length;i+=20){
    await rxChar.writeValue(data.slice(i,i+20));   // in 20-Byte-Häppchen, Reihenfolge bleibt
  }
}
let layout='EN';
async function sendLayout(){ if(rxChar) await rxChar.writeValue(new TextEncoder().encode('<<'+layout+'>>')); }

async function send(){
  let t=$('txt').value;
  if($('enter').checked) t+='\n';
  await writeChunked(t);
}

/* QR-Scan */
let stream=null, raf=null;
async function startScan(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){ alert('Kamera nicht verfügbar: '+e.message); return; }
  const v=$('video'); v.srcObject=stream; await v.play();
  $('cam').style.display='flex';
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d',{willReadFrequently:true});
  const native=('BarcodeDetector' in window)? new BarcodeDetector({formats:['qr_code']}):null;
  const tick=async()=>{
    if(v.readyState>=2){
      let code=null;
      if(native){ const r=await native.detect(v); if(r.length) code=r[0].rawValue; }
      else{ cv.width=v.videoWidth; cv.height=v.videoHeight; ctx.drawImage(v,0,0);
            const img=ctx.getImageData(0,0,cv.width,cv.height);
            const q=jsQR(img.data,img.width,img.height); if(q) code=q.data; }
      if(code){ onScan(code); return; }
    }
    raf=requestAnimationFrame(tick);
  };
  tick();
}
function stopScan(){
  if(raf) cancelAnimationFrame(raf);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; $('cam').style.display='none';
}
async function onScan(text){
  stopScan();
  $('txt').value=text;
  if($('autosend').checked) await send();
}

/* UI */
$('btnConn').onclick=connect;
$('btnSend').onclick=send;
$('btnScan').onclick=startScan;
$('btnStop').onclick=stopScan;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  layout=b.dataset.m;
  $('segEN').classList.toggle('on',layout==='EN');
  $('segDE').classList.toggle('on',layout==='DE');
  sendLayout();
});

/* PWA: Service Worker registrieren -> macht die Seite installierbar */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
